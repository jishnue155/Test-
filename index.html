<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>HIT4</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:16px}.top{text-align:center;padding:8px 0 14px}.top h1{margin:0;font-size:38px;letter-spacing:5px}.top p{margin:5px;color:#9ca3af}
.card{background:#151c2d;border:1px solid #29344a;border-radius:18px;padding:16px;margin:12px 0}
h2{margin:0 0 12px;font-size:19px}.balls{display:flex;justify-content:center;gap:9px;margin:16px 0}.ball{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#202a40;border:2px solid #506080;font-size:28px;font-weight:800}
.draw{width:100%;padding:16px;border:0;border-radius:13px;font-size:18px;font-weight:800;background:#fff;color:#111}.draw:disabled{opacity:.5}
.positions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pos{background:#0e1422;border:1px solid #34415a;border-radius:12px;padding:10px 5px;text-align:center}.pos b{display:block;margin-bottom:8px;font-size:12px;color:#aab4c8}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.n{padding:10px 0;border:1px solid #3b4860;border-radius:8px;background:#202a3c;color:#fff;font-weight:700}.n.sel{background:#fff;color:#111}.ticket{font-size:25px;font-weight:800;text-align:center;margin:14px 0 0;letter-spacing:5px}.status{text-align:center;margin-top:12px;font-weight:800;font-size:19px}.muted{color:#9ca3af;font-weight:normal;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.row input{width:100px;padding:9px;border-radius:8px;border:1px solid #44516a;background:#0d1320;color:#fff;font-size:16px}.actions{display:flex;gap:8px}.secondary{flex:1;padding:12px;border:1px solid #44516a;border-radius:10px;background:#202a3c;color:#fff;font-weight:700}.history div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #29344a}.win{font-size:22px}.flash{animation:pop .25s}@keyframes pop{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>HIT4</h1><p>4-Digit Lottery Machine</p></div>

<div class="card">
<h2>Winning Result</h2>
<div class="balls"><div class="ball" id="b0">?</div><div class="ball" id="b1">?</div><div class="ball" id="b2">?</div><div class="ball" id="b3">?</div></div>
<button class="draw" id="drawBtn" onclick="draw()">DRAW NUMBERS</button>
<div id="status" class="status muted">Select your ticket, then draw.</div>
</div>

<div class="card">
<h2>Select Your Ticket</h2>
<div class="positions" id="positions"></div>
<div class="ticket" id="ticket">____</div>
</div>

<div class="card">
<h2>Prize Amounts</h2>
<div class="row">1-Digit Chance <input id="p1" type="number" min="0" value="1"></div>
<div class="row">2-Digit Chance <input id="p2" type="number" min="0" value="5"></div>
<div class="row">3-Digit Chance <input id="p3" type="number" min="0" value="25"></div>
<div class="row">Straight <input id="ps" type="number" min="0" value="100"></div>
<div class="row">Rumble <input id="pr" type="number" min="0" value="50"></div>
</div>

<div class="card">
<h2>History</h2>
<div id="history" class="history"><span class="muted">No draws yet.</span></div>
<div class="actions" style="margin-top:12px"><button class="secondary" onclick="clearHistory()">Clear History</button><button class="secondary" onclick="resetTicket()">Reset Ticket</button></div>
</div>
</div>

<script>
const state={ticket:[null,null,null,null],history:JSON.parse(localStorage.getItem('hit4_history')||'[]')};
const posEl=document.getElementById('positions');
for(let p=0;p<4;p++){
 const box=document.createElement('div'); box.className='pos';
 box.innerHTML='<b>POSITION '+(p+1)+'</b>';
 const nums=document.createElement('div'); nums.className='nums';
 for(let d=0;d<10;d++){
  const btn=document.createElement('button');btn.className='n';btn.textContent=d;
  btn.onclick=()=>selectDigit(p,d,nums);
  nums.appendChild(btn);
 }
 box.appendChild(nums);posEl.appendChild(box);
}
function selectDigit(p,d,container){
 state.ticket[p]=d;
 [...container.children].forEach(x=>x.classList.remove('sel'));
 container.children[d].classList.add('sel');
 updateTicket();
}
function updateTicket(){document.getElementById('ticket').textContent=state.ticket.map(x=>x===null?'_':x).join('');}
function resetTicket(){state.ticket=[null,null,null,null];document.querySelectorAll('.n').forEach(x=>x.classList.remove('sel'));updateTicket();document.getElementById('status').textContent='Select your ticket, then draw.';document.getElementById('status').className='status muted'}
function val(id){return Number(document.getElementById(id).value)||0}
function sameCounts(a,b){const ca={},cb={};a.forEach(x=>ca[x]=(ca[x]||0)+1);b.forEach(x=>cb[x]=(cb[x]||0)+1);return JSON.stringify(ca)===JSON.stringify(cb)}
function check(ticket,result){
 if(ticket.join('')===result.join(''))return ['Straight',val('ps')];
 if(sameCounts(ticket,result))return ['Rumble',val('pr')];
 let n=0;for(let i=3;i>=0;i--){if(ticket[i]===result[i])n++;else break}
 if(n===3)return ['3-Digit Chance',val('p3')];
 if(n===2)return ['2-Digit Chance',val('p2')];
 if(n===1)return ['1-Digit Chance',val('p1')];
 return ['No Prize',0];
}
function draw(){
 if(state.ticket.some(x=>x===null)){document.getElementById('status').textContent='Please select all 4 ticket digits first.';document.getElementById('status').className='status';return}
 const btn=document.getElementById('drawBtn');btn.disabled=true;
 const result=Array.from({length:4},()=>Math.floor(Math.random()*10));
 let step=0;
 const timer=setInterval(()=>{
  const b=document.getElementById('b'+step);b.textContent=Math.floor(Math.random()*10);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),250);step++;
  if(step===4){
   clearInterval(timer);result.forEach((d,i)=>document.getElementById('b'+i).textContent=d);
   const [type,amount]=check(state.ticket,result);
   const s=document.getElementById('status');
   s.className='status '+(amount?'win':'');
   s.textContent=amount?type+' — Prize: '+amount:'No Prize';
   state.history.unshift({result:result.join(''),ticket:state.ticket.join(''),type,amount,time:new Date().toLocaleString()});
   state.history=state.history.slice(0,30);localStorage.setItem('hit4_history',JSON.stringify(state.history));renderHistory();btn.disabled=false;
  }
 },220);
}
function renderHistory(){
 const h=document.getElementById('history');
 if(!state.history.length){h.innerHTML='<span class="muted">No draws yet.</span>';return}
 h.innerHTML=state.history.map(x=>'<div><span><b>'+x.result+'</b><br><small class="muted">Ticket '+x.ticket+'</small></span><span style="text-align:right"><b>'+x.type+'</b><br><small class="muted">'+(x.amount?'Prize '+x.amount:'No prize')+'</small></span></div>').join('');
}
function clearHistory(){state.history=[];localStorage.removeItem('hit4_history');renderHistory();}
updateTicket();renderHistory();
</script>
</body>
</html>
